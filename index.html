    // Map bounds & region view definitions
    const regionViews = {
      ALL: { center: [35.2, 137.8], zoom: 7 },
      新宿: { center: [35.6945, 139.7022], zoom: 16 },
      大阪: { center: [34.6685, 135.5020], zoom: 16 },
      橫濱: { center: [35.4450, 139.6380], zoom: 15 }
    };

    let map;
    let markersLayerGroup;
    let activeRegion = 'ALL';
    let searchQuery = '';
    let currentFilteredSpots = [...spotsData];

    // Color definitions for Leaflet Pins
    const regionColors = {
      "新宿": { bg: "#dc2626", border: "#991b1b", text: "神室町", icon: "fa-city" },
      "大阪": { bg: "#f59e0b", border: "#b45309", text: "蒼天掘", icon: "fa-utensils" },
      "橫濱": { bg: "#0284c7", border: "#0369a1", text: "異人町", icon: "fa-anchor" }
    };

    // Helper: Create Custom HTML Marker Icon for Leaflet
    function createCustomIcon(spot) {
      const config = regionColors[spot.region] || { bg: "#dc2626", icon: "fa-location-dot" };
      
      const html = `
        <div class="relative group cursor-pointer">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-lg transform transition-transform group-hover:scale-125 border-2 border-slate-900" style="background-color: ${config.bg};">
            <i class="fa-solid ${config.icon}"></i>
          </div>
          <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 rotate-45 border-r border-b border-slate-900" style="background-color: ${config.bg};"></div>
        </div>
      `;

      return L.divIcon({
        html: html,
        className: 'custom-leaflet-pin',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView(regionViews.ALL.center, regionViews.ALL.zoom);

      // Add Zoom control to top right
      L.control.zoom({ position: 'topright' }).addTo(map);

      // Dark Mode Map Tile Layer (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
      }).addTo(map);

      markersLayerGroup = L.layerGroup().addTo(map);

      // Render initial markers & list
      renderMapAndList();
    }

    // Filter and Render logic
    function renderMapAndList() {
      // Clear existing markers
      markersLayerGroup.clearLayers();

      // Filter spots
      currentFilteredSpots = spotsData.filter(spot => {
        const matchesRegion = (activeRegion === 'ALL' || spot.region === activeRegion);
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q || 
          spot.realName.toLowerCase().includes(q) || 
          spot.gameName.toLowerCase().includes(q) || 
          spot.address.toLowerCase().includes(q) ||
          spot.desc.toLowerCase().includes(q);
        
        return matchesRegion && matchesSearch;
      });

      // Update spot counter
      document.getElementById('spotsCount').innerText = `顯示 ${currentFilteredSpots.length} / ${spotsData.length} 個聖地景點`;

      const listContainer = document.getElementById('spotsList');
      listContainer.innerHTML = '';

      if (currentFilteredSpots.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-compass text-3xl mb-2"></i>
            <p class="text-sm">未找到符合條件的聖地景點</p>
          </div>
        `;
        return;
      }

      const bounds = L.latLngBounds();

      // Loop through filtered items
      currentFilteredSpots.forEach(spot => {
        // 1. Add Marker to Leaflet
        const marker = L.marker([spot.lat, spot.lng], { icon: createCustomIcon(spot) });
        
        // Popup content
        const popupContent = `
          <div class="space-y-1">
            <div class="text-[10px] font-bold tracking-wider text-red-400 uppercase">${spot.region} · 原作：${spot.gameName}</div>
            <div class="text-sm font-bold text-white">${spot.realName}</div>
            <div class="text-xs text-slate-300 line-clamp-2">${spot.desc}</div>
            <button onclick="openModal(${spot.id})" class="mt-2 text-xs w-full py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded flex items-center justify-center gap-1">
              <i class="fa-solid fa-circle-info"></i> 詳細資料與導航
            </button>
          </div>
        `;

        marker.bindPopup(popupContent);
        marker.addTo(markersLayerGroup);
        bounds.extend([spot.lat, spot.lng]);

        // 2. Render Left Sidebar Card Item
        const config = regionColors[spot.region];
        const card = document.createElement('div');
        card.className = "p-3.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 hover:border-slate-700 rounded-xl transition-all cursor-pointer group flex flex-col justify-between";
        card.onclick = () => onCardClick(spot, marker);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${config.bg}"></span>
              <h3 class="text-sm font-bold text-slate-100 group-hover:text-red-400 transition-colors">${spot.realName}</h3>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded font-bold text-slate-300 bg-slate-800 border border-slate-700">${spot.region}</span>
          </div>

          <div class="text-xs text-red-400 font-medium mb-1 flex items-center gap-1">
            <i class="fa-solid fa-gamepad text-[10px]"></i> 原作：${spot.gameName}
          </div>

          <p class="text-xs text-slate-400 line-clamp-2 mb-2 leading-relaxed">${spot.desc}</p>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-[11px] text-slate-500">
            <span class="truncate max-w-[200px]"><i class="fa-solid fa-location-dot mr-1"></i>${spot.address}</span>
            <span class="text-slate-400 font-semibold group-hover:translate-x-0.5 transition-transform">詳情 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
          </div>
        `;

        listContainer.appendChild(card);
      });

      // Fit map bounds if filtering or tab switching
      if (currentFilteredSpots.length > 0) {
        if (activeRegion !== 'ALL') {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16, animate: true });
        } else if (!searchQuery) {
          map.setView(regionViews.ALL.center, regionViews.ALL.zoom, { animate: true });
        } else {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }
      }
    }

    // Switch Region Tab
    function switchTab(region) {
      activeRegion = region;

      // Update button styles
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-red-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.getElementById(`tab-${region}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-red-600', 'text-white', 'shadow');
        activeBtn.classList.remove('text-slate-400');
      }

      renderMapAndList();
    }

    // Handle Search Bar Input
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderMapAndList();
    }

    // Click Card Action
    function onCardClick(spot, marker) {
      map.flyTo([spot.lat, spot.lng], 17, { duration: 1.2 });
      marker.openPopup();
      
      // On mobile, switch view to map on selection
      if (window.innerWidth < 768) {
        toggleMobileView('map');
      }
    }

    // Open Detailed Modal
    function openModal(id) {
      const spot = spotsData.find(s => s.id === id);
      if (!spot) return;

      const config = regionColors[spot.region];

      document.getElementById('modalId').innerText = `SPOT #${String(spot.id).padStart(2, '0')}`;
      document.getElementById('modalRealName').innerText = spot.realName;
      document.getElementById('modalGameName').innerText = spot.gameName;
      document.getElementById('modalAddress').innerText = spot.address;
      document.getElementById('modalDescription').innerText = spot.desc;

      // Region Badge
      const badge = document.getElementById('modalRegionBadge');
      badge.innerText = `${spot.region} 聖地`;
      badge.style.backgroundColor = config.bg;
      badge.style.color = '#ffffff';

      // Google Maps Navigation Link (Direct Query)
      const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.realName + ' ' + spot.address)}`;
      document.getElementById('modalGMapBtn').href = gmapUrl;

      // Featured Games Tags
      const gamesContainer = document.getElementById('modalGames');
      gamesContainer.innerHTML = '';
      spot.games.forEach(game => {
        const tag = document.createElement('span');
        tag.className = 'px-2.5 py-1 bg-slate-800 text-amber-300 border border-slate-700 rounded-lg text-xs font-medium';
        tag.innerHTML = `<i class="fa-solid fa-gamepad mr-1"></i>${game}`;
        gamesContainer.appendChild(tag);
      });

      // Show Modal
      const modal = document.getElementById('detailModal');
      const card = document.getElementById('modalCard');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }

    // Close Modal
    function closeModal() {
      const modal = document.getElementById('detailModal');
      const card = document.getElementById('modalCard');
      modal.classList.add('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
    }

    // Mobile View Toggle Logic
    let mobileView = 'list'; // 'list' or 'map'
    function toggleMobileView(forceView) {
      const sidebar = document.getElementById('sidebar');
      const toggleIcon = document.getElementById('toggleIcon');
      const toggleText = document.getElementById('toggleText');

      if (forceView) {
        mobileView = forceView;
      } else {
        mobileView = mobileView === 'list' ? 'map' : 'list';
      }

      if (mobileView === 'map') {
        sidebar.classList.add('hidden');
        toggleIcon.className = 'fa-solid fa-list-ul';
        toggleText.innerText = '切換列表';
      } else {
        sidebar.classList.remove('hidden');
        toggleIcon.className = 'fa-solid fa-map-location-dot';
        toggleText.innerText = '切換地圖';
      }

      setTimeout(() => { map.invalidateSize(); }, 200);
    }

    // Modal Background Overlay Close Trigger
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    // Initialize application on window load
    window.onload = function () {
      initMap();
    };
  </script>
