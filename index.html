      { id: 21, region: "大阪", realName: "法善寺橫丁", gameName: "招福町懷舊石板巷弄", category: "特色街道", lat: 34.6678, lng: 135.5022, address: "大阪府大阪市中央區難波1丁目", desc: "鋪滿石板路與掛滿燈籠的古樸巷弄，遊戲中藏有諸多小料理屋與將棋棋牌室。" },

      // 橫濱異人町 (Ijincho)
      { id: 22, region: "橫濱", realName: "伊勢佐木モール", gameName: "伊勢佐木大道", category: "商店街", lat: 35.4442, lng: 139.6322, address: "神奈川縣橫濱市中區伊勢佐木町", desc: "《人中之龍7》春日一番展開新生的主要商業徒步街，連接各類餐廳與打工英雄任務點。" },
      { id: 23, region: "橫濱", realName: "橫濱中華街（善鄰門 / 朝陽門）", gameName: "中華街入口牌樓 / 橫濱流氓地盤", category: "地標門樓", lat: 35.4431, lng: 139.6453, address: "神奈川縣橫濱市中區山下町", desc: "趙天佑率領的「橫濱流氓」地盤，擁有精緻中華美食與宏偉的華麗牌樓。" },
      { id: 24, region: "橫濱", realName: "山下公園", gameName: "濱北公園", category: "海濱公園", lat: 35.4458, lng: 139.6496, address: "神奈川縣橫濱市中區山下町279", desc: "異人町臨海的大型綠地公園，玩家可在此進行「撿空罐大賽」與「龍人賽車」賽車競速。" },
      { id: 25, region: "橫濱", realName: "橫濱赤レンガ倉庫", gameName: "異人町 港灣紅磚倉庫", category: "歷史建築", lat: 35.4528, lng: 139.6428, address: "神奈川縣橫濱市中區新港1-1", desc: "橫濱港邊著名的懷舊紅磚建築，位於異人町地圖東北側港區。" },
      { id: 26, region: "橫濱", realName: "大岡川沿岸", gameName: "櫻川沿岸", category: "自然河川", lat: 35.4435, lng: 139.6272, address: "神奈川縣橫濱市中區日之出町", desc: "貫穿異人町的河流，河岸邊設有流浪者營地，呈現出異人町獨特的包容文化。" },
      { id: 27, region: "橫濱", realName: "ぴおシティ / 櫻木町地下街", gameName: "櫻川地下街", category: "地下商場", lat: 35.4502, lng: 139.6308, address: "神奈川縣橫濱市中區櫻木町1-1", desc: "櫻木町車站旁的懷舊地下商場，遊戲中還原了復古的地下居酒屋與店面。" },
      { id: 28, region: "橫濱", realName: "橫濱コスモワールド", gameName: "奇蹟摩天輪公園", category: "主題樂園", lat: 35.4552, lng: 139.6369, address: "神奈川縣橫濱市中區新港2-8-1", desc: "擁有巨型大摩天輪的都市型遊樂園，勾勒出異人町壯麗的海港天際線。" },
      { id: 29, region: "橫濱", realName: "JR 櫻木町站", gameName: "陣內車站", category: "交通樞紐", lat: 35.4507, lng: 139.6310, address: "神奈川縣橫濱市中區櫻木町1丁目", desc: "異人町的核心鐵路車站，分割了北側商業區與南側的生活住宅區。" },
      { id: 30, region: "橫濱", realName: "橫濱長者町風俗街區", gameName: "乙姬樂園周邊 / 泡泡浴街", category: "特色風俗區", lat: 35.4428, lng: 139.6292, address: "神奈川縣橫濱市中區長者町", desc: "《人中之龍7》故事起點「乙姬樂園」所在地，野野宮店長與夥伴們最初交會處。" },
      { id: 31, region: "橫濱", realName: "橫濱スタジアム", gameName: "陣內體育場", category: "體育場館", lat: 35.4433, lng: 139.6401, address: "神奈川縣橫濱市中區橫濱公園", desc: "座落於地圖中央的巨大棒球場地標，周邊公園景緻宜人。" }
    ];

    // Center coordinates for map navigation
    const regionViews = {
      ALL: { center: [35.2, 137.8], zoom: 7 },
      新宿: { center: [35.6945, 139.7022], zoom: 16 },
      大阪: { center: [34.6685, 135.5020], zoom: 16 },
      橫濱: { center: [35.4450, 139.6380], zoom: 15 }
    };

    // Color definitions for Pins
    const regionColors = {
      "新宿": { bg: "#dc2626", border: "#991b1b", text: "神室町", icon: "fa-city" },
      "大阪": { bg: "#f59e0b", border: "#b45309", text: "蒼天掘", icon: "fa-utensils" },
      "橫濱": { bg: "#0284c7", border: "#0369a1", text: "異人町", icon: "fa-anchor" }
    };

    let map;
    let clusterGroup;
    let activeRegion = 'ALL';
    let searchQuery = '';

    // Create Custom HTML Marker Icon for Leaflet Pins
    function createCustomIcon(spot) {
      const config = regionColors[spot.region] || { bg: "#dc2626", icon: "fa-location-dot" };
      
      const html = `
        <div class="relative group cursor-pointer">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-lg transform transition-transform group-hover:scale-125 border-2 border-slate-900" style="background-color: ${config.bg};">
            <i class="fa-solid ${config.icon}"></i>
          </div>
          <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 rotate-45 border-r border-b border-slate-900" style="background-color: ${config.bg};"></div>
        </div>
      `;

      return L.divIcon({
        html: html,
        className: 'custom-leaflet-pin',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView(regionViews.ALL.center, regionViews.ALL.zoom);

      L.control.zoom({ position: 'topright' }).addTo(map);

      // STANDARD OPENSTREETMAP TILE LAYER
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Initialize MarkerCluster Group with Custom Numbered Icon Style
      clusterGroup = L.markerClusterGroup({
        maxClusterRadius: 45,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function(cluster) {
          const count = cluster.getChildCount();
          return L.divIcon({
            html: `
              <div class="relative group cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-600 via-amber-600 to-red-800 text-white font-black text-sm flex items-center justify-center border-2 border-slate-950 shadow-xl shadow-red-950/80 ring-2 ring-amber-500/50 transform transition-transform group-hover:scale-110">
                  ${count}
                </div>
              </div>
            `,
            className: 'custom-cluster-marker',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });
        }
      });

      map.addLayer(clusterGroup);

      renderMapAndList();
    }

    function renderMapAndList() {
      clusterGroup.clearLayers();

      const filtered = spotsData.filter(spot => {
        const matchesRegion = (activeRegion === 'ALL' || spot.region === activeRegion);
        const q = searchQuery.toLowerCase();
        const matchesSearch = !q || 
          spot.realName.toLowerCase().includes(q) || 
          spot.gameName.toLowerCase().includes(q) || 
          spot.address.toLowerCase().includes(q) ||
          spot.desc.toLowerCase().includes(q) ||
          spot.category.toLowerCase().includes(q);
        
        return matchesRegion && matchesSearch;
      });

      document.getElementById('spotsCount').innerText = `顯示 ${filtered.length} / ${spotsData.length} 個景點`;

      const listContainer = document.getElementById('spotsList');
      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-12 text-slate-500 space-y-2">
            <i class="fa-solid fa-compass text-3xl"></i>
            <p class="text-sm">沒有找到符合條件的聖地景點</p>
          </div>
        `;
        return;
      }

      const bounds = L.latLngBounds();

      filtered.forEach(spot => {
        // Marker creation
        const marker = L.marker([spot.lat, spot.lng], { icon: createCustomIcon(spot) });
        
        const popupHtml = `
          <div class="space-y-1">
            <div class="text-[10px] font-bold tracking-wider text-red-400 uppercase">${spot.region} · 原作：${spot.gameName}</div>
            <div class="text-sm font-bold text-white">${spot.realName}</div>
            <div class="text-xs text-slate-300 line-clamp-2">${spot.desc}</div>
            <button onclick="openModal(${spot.id})" class="mt-2 text-xs w-full py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded flex items-center justify-center gap-1">
              <i class="fa-solid fa-circle-info"></i> 詳細資料與導航
            </button>
          </div>
        `;

        marker.bindPopup(popupHtml);
        clusterGroup.addLayer(marker);
        bounds.extend([spot.lat, spot.lng]);

        // Sidebar Card creation
        const config = regionColors[spot.region];
        const card = document.createElement('div');
        card.className = "p-3.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 hover:border-slate-700 rounded-xl transition-all cursor-pointer group flex flex-col justify-between";
        card.onclick = () => onCardClick(spot, marker);

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full inline-block flex-shrink-0" style="background-color: ${config.bg}"></span>
                <h3 class="text-sm font-bold text-slate-100 group-hover:text-red-400 transition-colors">${spot.realName}</h3>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded font-bold text-slate-300 bg-slate-800 border border-slate-700 flex-shrink-0">${spot.category}</span>
            </div>

            <div class="text-xs text-red-400 font-semibold mb-1 flex items-center gap-1">
              <i class="fa-solid fa-gamepad text-[10px]"></i> 原作：${spot.gameName}
            </div>

            <p class="text-xs text-slate-400 line-clamp-2 mb-2 leading-relaxed">${spot.desc}</p>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-[11px] text-slate-500">
            <span class="truncate max-w-[200px]"><i class="fa-solid fa-location-dot mr-1"></i>${spot.address}</span>
            <span class="text-slate-400 font-bold group-hover:translate-x-0.5 transition-transform">詳情 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
          </div>
        `;

        listContainer.appendChild(card);
      });

      // Smooth Fit Bounds when changing tabs or searching
      if (filtered.length > 0) {
        if (activeRegion !== 'ALL') {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16, animate: true });
        } else if (!searchQuery) {
          map.setView(regionViews.ALL.center, regionViews.ALL.zoom, { animate: true });
        } else {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }
      }
    }

    function switchTab(region) {
      activeRegion = region;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-red-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.getElementById(`tab-${region}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-red-600', 'text-white', 'shadow');
        activeBtn.classList.remove('text-slate-400');
      }

      renderMapAndList();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderMapAndList();
    }

    // Card Selection: Automatically unclusters and reveals marker
    function onCardClick(spot, marker) {
      clusterGroup.zoomToShowLayer(marker, function() {
        marker.openPopup();
      });
      
      if (window.innerWidth < 768) {
        toggleMobileView('map');
      }
    }

    function openModal(id) {
      const spot = spotsData.find(s => s.id === id);
      if (!spot) return;

      const config = regionColors[spot.region];

      document.getElementById('modalRealName').innerText = spot.realName;
      document.getElementById('modalGameName').innerText = spot.gameName;
      document.getElementById('modalAddress').innerText = spot.address;
      document.getElementById('modalDescription').innerText = spot.desc;
      document.getElementById('modalCategoryBadge').innerText = spot.category;

      const badge = document.getElementById('modalRegionBadge');
      badge.innerText = `${spot.region} 聖地`;
      badge.style.backgroundColor = config.bg;
      badge.style.color = '#ffffff';

      // Google Maps Direct Search & Navigation Link
      const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.realName + ' ' + spot.address)}`;
      document.getElementById('modalGMapBtn').href = gmapUrl;

      const modal = document.getElementById('detailModal');
      const card = document.getElementById('modalCard');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      const card = document.getElementById('modalCard');
      modal.classList.add('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
    }

    // Mobile View Switcher
    let mobileView = 'list';
    function toggleMobileView(forceView) {
      const sidebar = document.getElementById('sidebar');
      const toggleIcon = document.getElementById('toggleIcon');
      const toggleText = document.getElementById('toggleText');

      if (forceView) {
        mobileView = forceView;
      } else {
        mobileView = mobileView === 'list' ? 'map' : 'list';
      }

      if (mobileView === 'map') {
        sidebar.classList.add('hidden');
        toggleIcon.className = 'fa-solid fa-list-ul';
        toggleText.innerText = '切換列表';
      } else {
        sidebar.classList.remove('hidden');
        toggleIcon.className = 'fa-solid fa-map-location-dot';
        toggleText.innerText = '切換地圖';
      }

      setTimeout(() => { map.invalidateSize(); }, 200);
    }

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeModal();
    });

    // Start map on window load
    window.onload = function () {
      initMap();
    };
  </script>
</body>
</html>
